services:
  # ---------------------------------------------------------------------------
  # PostgreSQL = local stand-in for Amazon Redshift.
  # Redshift is PostgreSQL-wire-compatible, so the same DDL/dbt models run on both.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17
    container_name: divakar-warehouse
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-deuser}
      # Local development default only. Set POSTGRES_PASSWORD in the shell (or a
      # local .env, which is git-ignored) for anything shared or deployed.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-depass}
      POSTGRES_DB: analytics
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    ports:
      - "5433:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deuser -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------------
  # MinIO = local stand-in for Amazon S3 (optional, profile "s3").
  # Requires registry access to minio/minio. When unavailable, the platform
  # automatically uses the filesystem S3 backend (identical key layout).
  #   docker compose --profile s3 up -d minio minio-init
  # ---------------------------------------------------------------------------
  minio:
    profiles: ["s3"]
    image: minio/minio:latest
    container_name: divakar-datalake
    command: server /data --console-address ":9001"
    environment:
      # Local development defaults only. Override via MINIO_ROOT_USER /
      # MINIO_ROOT_PASSWORD for anything shared or deployed.
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - lake_data:/data

  minio-init:
    profiles: ["s3"]
    image: minio/mc:latest
    container_name: divakar-datalake-init
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      mc alias set lake http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb --ignore-existing lake/bronze &&
      mc mb --ignore-existing lake/silver &&
      mc mb --ignore-existing lake/gold &&
      mc mb --ignore-existing lake/artifacts &&
      echo 'buckets ready'"

  # ---------------------------------------------------------------------------
  # Containerised API:  docker compose --profile full up -d --build
  # ---------------------------------------------------------------------------
  api:
    profiles: ["full"]
    build:
      context: .
      dockerfile: Dockerfile
    container_name: divakar-api
    environment:
      WAREHOUSE_HOST: postgres
      WAREHOUSE_PORT: 5432
      LAKE_BACKEND: local
      LAKE_ROOT: /app/data/lake
    ports:
      - "8100:8100"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  warehouse_data:
  lake_data:
